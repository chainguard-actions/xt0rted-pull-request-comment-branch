name: Test - invalid token causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REPOSITORY: octocat/hello-world
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: "ghp_invalidtokenvalue"

      - name: Assert action failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid token, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with an invalid token"
