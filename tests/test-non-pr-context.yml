name: Test non-PR context error handling

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch, context.issue.number is 0 (no PR).
      # The action calls the GitHub API to check if issue 0 is a PR,
      # which will either return a non-PR or fail. Either way the action
      # should set a failure with a meaningful error message.
      - id: action
        uses: .
        with:
          repo_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed as expected (no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR comment context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR comment context"
