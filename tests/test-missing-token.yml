name: Test missing required token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo_token: ""
        continue-on-error: true
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without a valid token the action should fail, not succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail without a valid token"
            exit 1
          fi
          echo "PASS: action correctly failed without a valid token (outcome=$OUTCOME)"
