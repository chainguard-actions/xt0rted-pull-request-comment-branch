name: Test error when repo_token is missing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action declares repo_token as required: true.
      # Omitting it should cause the action to fail at input validation.
      - id: action
        uses: .
        with:
          repo_token: ""
        continue-on-error: true

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when repo_token is empty, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when repo_token is missing/empty"
