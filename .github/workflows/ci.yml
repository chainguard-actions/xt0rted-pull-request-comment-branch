name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [12, 14]

    steps:
      - name: Checkout repo
        uses: actions/checkout@2036a08e25fa78bbd946711a407b529a0a1204bf # v2.3.2

      - name: Install node
        uses: actions/setup-node@4bb8c450539a93c2c5789587ecde80fc8c939605 # v1.4.3
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm test

      - run: npm run build
