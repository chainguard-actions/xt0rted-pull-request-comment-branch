name: Pull Request

on: pull_request

permissions: {}

jobs:
  message-check:
    name: Block Autosquash Commits

    runs-on: ubuntu-latest

    steps:
      - name: Block Autosquash Commits
        uses: xt0rted/block-autosquash-commits-action@44e09ef2552cbbdb94f8917051fe8c04eefcbfba # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
