name: Pull Request

on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  message-check:
    name: Block Autosquash Commits

    runs-on: ubuntu-latest

    steps:
      - name: Block Autosquash Commits
        uses: xt0rted/block-autosquash-commits-action@cd70ede293e6a8a8c1ddf0dcd3f5858b184cc56a # v2.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
